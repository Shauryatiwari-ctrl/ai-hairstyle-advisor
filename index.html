<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hairstyle & Color Advisor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide React Icons (inline SVG components)
        const Camera = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const Sparkles = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
        );

        const Upload = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        );

        const Loader2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        function HairstyleAdvisor() {
            const [image, setImage] = useState(null);
            const [imageData, setImageData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [recommendations, setRecommendations] = useState(null);
            const [faceShape, setFaceShape] = useState('');
            const [skinTone, setSkinTone] = useState('');
            const [hairLength, setHairLength] = useState('');

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setImage(event.target.result);
                        setImageData(event.target.result.split(',')[1]);
                        setRecommendations(null);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeAndRecommend = async () => {
                setLoading(true);
                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [
                                {
                                    role: 'user',
                                    content: [
                                        {
                                            type: 'image',
                                            source: {
                                                type: 'base64',
                                                media_type: 'image/jpeg',
                                                data: imageData
                                            }
                                        },
                                        {
                                            type: 'text',
                                            text: `Analyze this person's face and provide hairstyle and color recommendations. Additional info: Face shape preference: ${faceShape || 'any'}, Skin tone: ${skinTone || 'any'}, Desired hair length: ${hairLength || 'any'}.

Please respond ONLY with a JSON object (no markdown, no preamble) in this exact format:
{
  "faceShape": "detected face shape",
  "skinTone": "detected skin tone",
  "currentHair": "description of current hairstyle",
  "hairstyles": [
    {"name": "style name", "reason": "why it suits them"},
    {"name": "style name", "reason": "why it suits them"},
    {"name": "style name", "reason": "why it suits them"}
  ],
  "colors": [
    {"name": "color name", "reason": "why it complements them"},
    {"name": "color name", "reason": "why it complements them"},
    {"name": "color name", "reason": "why it complements them"}
  ],
  "styling": "styling tips"
}`
                                        }
                                    ]
                                }
                            ]
                        })
                    });

                    const data = await response.json();
                    const text = data.content.find(c => c.type === 'text')?.text || '';
                    const clean = text.replace(/```json|```/g, '').trim();
                    const parsed = JSON.parse(clean);
                    setRecommendations(parsed);
                } catch (err) {
                    console.error('Error:', err);
                    alert('Failed to analyze image. Please try again.');
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50">
                    <div className="max-w-6xl mx-auto p-6">
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center gap-3 mb-3">
                                <Sparkles className="w-10 h-10 text-purple-600" />
                                <h1 className="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                                    AI Hairstyle Advisor
                                </h1>
                            </div>
                            <p className="text-gray-600 text-lg">
                                Get personalized hairstyle and color recommendations powered by AI
                            </p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-white rounded-2xl shadow-xl p-6">
                                <h2 className="text-2xl font-semibold mb-4 flex items-center gap-2">
                                    <Camera className="w-6 h-6 text-purple-600" />
                                    Upload Your Photo
                                </h2>

                                <div className="space-y-4">
                                    <div className="border-3 border-dashed border-purple-300 rounded-xl p-8 text-center hover:border-purple-500 transition-colors">
                                        <input
                                            type="file"
                                            accept="image/*"
                                            onChange={handleImageUpload}
                                            className="hidden"
                                            id="imageInput"
                                        />
                                        <label htmlFor="imageInput" className="cursor-pointer">
                                            {image ? (
                                                <img src={image} alt="Uploaded" className="max-h-64 mx-auto rounded-lg" />
                                            ) : (
                                                <div className="text-gray-500">
                                                    <Upload className="w-16 h-16 mx-auto mb-3 text-purple-400" />
                                                    <p className="text-lg font-medium">Click to upload your photo</p>
                                                    <p className="text-sm mt-1">For best results, use a clear front-facing photo</p>
                                                </div>
                                            )}
                                        </label>
                                    </div>

                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Face Shape (optional)
                                            </label>
                                            <select
                                                value={faceShape}
                                                onChange={(e) => setFaceShape(e.target.value)}
                                                className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            >
                                                <option value="">Let AI detect</option>
                                                <option value="oval">Oval</option>
                                                <option value="round">Round</option>
                                                <option value="square">Square</option>
                                                <option value="heart">Heart</option>
                                                <option value="diamond">Diamond</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Skin Tone (optional)
                                            </label>
                                            <select
                                                value={skinTone}
                                                onChange={(e) => setSkinTone(e.target.value)}
                                                className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            >
                                                <option value="">Let AI detect</option>
                                                <option value="fair">Fair</option>
                                                <option value="light">Light</option>
                                                <option value="medium">Medium</option>
                                                <option value="olive">Olive</option>
                                                <option value="tan">Tan</option>
                                                <option value="deep">Deep</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Desired Hair Length
                                            </label>
                                            <select
                                                value={hairLength}
                                                onChange={(e) => setHairLength(e.target.value)}
                                                className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            >
                                                <option value="">Any length</option>
                                                <option value="short">Short</option>
                                                <option value="medium">Medium</option>
                                                <option value="long">Long</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button
                                        onClick={analyzeAndRecommend}
                                        disabled={!image || loading}
                                        className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2"
                                    >
                                        {loading ? (
                                            <>
                                                <Loader2 className="w-5 h-5 animate-spin" />
                                                Analyzing...
                                            </>
                                        ) : (
                                            <>
                                                <Sparkles className="w-5 h-5" />
                                                Get Recommendations
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-xl p-6">
                                <h2 className="text-2xl font-semibold mb-4">Your Recommendations</h2>

                                {!recommendations && !loading && (
                                    <div className="text-center text-gray-500 py-16">
                                        <Sparkles className="w-16 h-16 mx-auto mb-3 text-gray-300" />
                                        <p>Upload a photo to get personalized recommendations</p>
                                    </div>
                                )}

                                {loading && (
                                    <div className="text-center py-16">
                                        <Loader2 className="w-16 h-16 mx-auto mb-3 text-purple-600 animate-spin" />
                                        <p className="text-gray-600">Analyzing your features...</p>
                                    </div>
                                )}

                                {recommendations && (
                                    <div className="space-y-6 max-h-[600px] overflow-y-auto pr-2">
                                        <div className="bg-purple-50 rounded-xl p-4">
                                            <h3 className="font-semibold text-purple-900 mb-2">Face Analysis</h3>
                                            <p className="text-sm text-gray-700">
                                                <strong>Face Shape:</strong> {recommendations.faceShape}
                                            </p>
                                            <p className="text-sm text-gray-700">
                                                <strong>Skin Tone:</strong> {recommendations.skinTone}
                                            </p>
                                            <p className="text-sm text-gray-700 mt-1">
                                                <strong>Current Style:</strong> {recommendations.currentHair}
                                            </p>
                                        </div>

                                        <div>
                                            <h3 className="font-semibold text-lg mb-3 text-purple-900">
                                                Recommended Hairstyles
                                            </h3>
                                            <div className="space-y-3">
                                                {recommendations.hairstyles.map((style, idx) => (
                                                    <div key={idx} className="bg-gradient-to-r from-purple-100 to-pink-100 rounded-lg p-4">
                                                        <h4 className="font-semibold text-purple-900">{style.name}</h4>
                                                        <p className="text-sm text-gray-700 mt-1">{style.reason}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="font-semibold text-lg mb-3 text-pink-900">
                                                Recommended Colors
                                            </h3>
                                            <div className="space-y-3">
                                                {recommendations.colors.map((color, idx) => (
                                                    <div key={idx} className="bg-gradient-to-r from-pink-100 to-purple-100 rounded-lg p-4">
                                                        <h4 className="font-semibold text-pink-900">{color.name}</h4>
                                                        <p className="text-sm text-gray-700 mt-1">{color.reason}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 rounded-xl p-4">
                                            <h3 className="font-semibold text-blue-900 mb-2">Styling Tips</h3>
                                            <p className="text-sm text-gray-700">{recommendations.styling}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="mt-8 bg-white rounded-xl shadow-lg p-6">
                            <h3 className="font-semibold text-lg mb-3">How It Works</h3>
                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="text-center">
                                    <div className="bg-purple-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2">
                                        <span className="text-purple-600 font-bold">1</span>
                                    </div>
                                    <p className="text-sm text-gray-600">Upload a clear photo of your face</p>
                                </div>
                                <div className="text-center">
                                    <div className="bg-pink-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2">
                                        <span className="text-pink-600 font-bold">2</span>
                                    </div>
                                    <p className="text-sm text-gray-600">AI analyzes your features and face shape</p>
                                </div>
                                <div className="text-center">
                                    <div className="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2">
                                        <span className="text-blue-600 font-bold">3</span>
                                    </div>
                                    <p className="text-sm text-gray-600">Get personalized style recommendations</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<HairstyleAdvisor />, document.getElementById('root'));
    </script>
</body>
</html>
